substitutions:
  main_name: "wildlife-cam"
  friendly_name: "Wildlife Cam"

packages:
  platform: !include ../common/esp32-cam.yaml

web_server:
  port: 80
  version: 3

esp32_camera:
  name: "${friendly_name}"
  max_framerate: 10.0 fps
  idle_framerate: 0.1 fps

esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

number:
  - platform: template
    name: "Flash Brightness"
    id: flash_brightness
    icon: "mdi:brightness-percent"
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    optimistic: true
    initial_value: 0
    restore_value: true
    set_action:
      - if:
          condition:
            lambda: 'return x <= 0.0;'
          then:
            - light.turn_off: esp_cam_light
          else:
            - light.turn_on:
                id: esp_cam_light
                brightness: !lambda 'return x / 100.0;'
