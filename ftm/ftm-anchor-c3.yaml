packages:
  platform: !include ../common/esp32-c3.yaml

substitutions:
  main_name: "ftm-anchor-c3"
  friendly_name: "FTM Anchor C3"

esphome:
  name: "${main_name}"
  friendly_name: "${friendly_name}"

esp32:
  framework:
    sdkconfig_options:
      CONFIG_ESP_WIFI_FTM_ENABLE: y
      CONFIG_ESP_WIFI_FTM_RESPONDER_SUPPORT: y

external_components:
  - source:
      type: local
      path: ../components

api:
  encryption:
    key: "cXn2Hy3NV1VgjSkuRcOVQnBUCROkDkVaTARTckWVz80="

ota:
  - platform: esphome

wifi:
  post_connect_roaming: false
  power_save_mode: NONE
  # Required so ESPHome compiles esp_netif_create_default_wifi_ap():
  ap:
    ssid: "FTM_ANCHOR_C3"
    ap_timeout: 0s

wifi_ftm_anchor:
  offset_cm: 0
  bssid:
    name: "Anchor SoftAP BSSID"
